<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f9f8"/>
  <rect x="70" y="70" width="1060" height="535" rx="10" fill="#fff" stroke="#24343b" stroke-width="3"/>
  <text x="95" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#24343b">安装几何：先对齐中心线，再确认锁舌受力</text>
  <text x="95" y="143" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#60747a">样机放行前必须同时记录门体、门框、锁舌路径、密封条和维护空间</text>
  <rect x="130" y="185" width="350" height="285" fill="#d9e4e2" stroke="#24343b" stroke-width="4"/>
  <text x="165" y="220" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24343b">01 门扇</text>
  <text x="165" y="247" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#46616a">记录门厚、开启方向、铰链位置</text>
  <rect x="250" y="290" width="210" height="92" rx="6" fill="#667980" stroke="#24343b" stroke-width="4"/>
  <text x="276" y="327" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#fff">隐形锁体 / 电池仓</text>
  <text x="295" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#dce8e8">锁体中心线</text>
  <line x1="230" y1="336" x2="830" y2="336" stroke="#e08d32" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="520" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#b66516">锁体中心线 = 锁扣中心线</text>
  <rect x="480" y="185" width="80" height="285" fill="#f0cfa7" stroke="#24343b" stroke-width="4"/>
  <text x="498" y="510" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#24343b" transform="rotate(-90 498 510)">02 门框 / 门边</text>
  <rect x="560" y="286" width="230" height="100" rx="5" fill="#9aa9ad" stroke="#24343b" stroke-width="4"/>
  <text x="593" y="326" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#24343b">03 锁扣盒</text>
  <text x="585" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#24343b">入口不能顶住锁舌端部</text>
  <rect x="560" y="248" width="230" height="22" fill="#78a5a0"/>
  <text x="815" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#3c716b">04 密封条回弹力</text>
  <path d="M 465 336 L 545 336" stroke="#e08d32" stroke-width="12" marker-end="url(#arrow)"/>
  <path d="M 805 250 C 870 280 870 392 805 425" fill="none" stroke="#c55245" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="875" y="340" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#a33e35">摩擦 / 偏移阻力</text>
  <line x1="150" y1="530" x2="780" y2="530" stroke="#24343b" stroke-width="2"/>
  <line x1="150" y1="520" x2="150" y2="540" stroke="#24343b" stroke-width="2"/>
  <line x1="780" y1="520" x2="780" y2="540" stroke="#24343b" stroke-width="2"/>
  <text x="265" y="568" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#24343b">测量锁体位置到锁扣盒入口的有效距离</text>
  <circle cx="895" cy="185" r="17" fill="#e08d32"/><text x="884" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">05</text><text x="925" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#24343b">维护空间</text><text x="925" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#60747a">电池、螺丝刀、应急供电</text><text x="925" y="243" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#60747a">和线束弯折半径都要留出余量</text>
  <rect x="850" y="430" width="245" height=" ninety" rx="8" fill="#eef3f1" stroke="#3c716b" stroke-width="2"/>
  <text x="875" y="463" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3c716b">现场判定</text><text x="875" y="490" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#24343b">闭门后无需持续推拉</text><text x="875" y="516" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#24343b">锁舌一次进入并回收</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e08d32"/></marker></defs>
</svg>
