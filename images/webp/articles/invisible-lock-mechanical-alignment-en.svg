<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <rect width="1200" height="675" fill="#f7f9f8"/>
  <rect x="70" y="70" width="1060" height="535" rx="10" fill="#fff" stroke="#24343b" stroke-width="3"/>
  <text x="95" y="112" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="26" font-weight="700" fill="#24343b">MECHANICAL ALIGNMENT: ALIGN THE CENTERLINE BEFORE TESTING LOAD</text>
  <text x="95" y="143" font-family="Arial,sans-serif" font-size="17" fill="#60747a">Record the door, frame, latch path, seal force and service clearance before sample release</text>
  <rect x="130" y="185" width="350" height="285" fill="#d9e4e2" stroke="#24343b" stroke-width="4"/>
  <text x="165" y="220" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#24343b">01 DOOR LEAF</text>
  <text x="165" y="247" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#46616a">Record thickness, handing and hinge position</text>
  <rect x="250" y="290" width="210" height="92" rx="6" fill="#667980" stroke="#24343b" stroke-width="4"/>
  <text x="276" y="327" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#fff">CONCEALED LOCK BODY / BATTERY</text>
  <text x="295" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#dce8e8">LOCK CENTERLINE</text>
  <line x1="230" y1="336" x2="830" y2="336" stroke="#e08d32" stroke-width="5" stroke-dasharray="12 8"/>
  <text x="520" y="315" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#b66516">LOCK CENTERLINE = STRIKE CENTERLINE</text>
  <rect x="480" y="185" width="80" height="285" fill="#f0cfa7" stroke="#24343b" stroke-width="4"/>
  <text x="498" y="510" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" fill="#24343b" transform="rotate(-90 498 510)">02 FRAME / DOOR EDGE</text>
  <rect x="560" y="286" width="230" height="100" rx="5" fill="#9aa9ad" stroke="#24343b" stroke-width="4"/>
  <text x="593" y="326" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#24343b">03 STRIKE BOX</text>
  <text x="585" y="355" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#24343b">Entry must not press the latch tip</text>
  <rect x="560" y="248" width="230" height="22" fill="#78a5a0"/>
  <text x="815" y="265" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#3c716b">04 SEAL RETURN FORCE</text>
  <path d="M 465 336 L 545 336" stroke="#e08d32" stroke-width="12" marker-end="url(#arrow)"/>
  <path d="M 805 250 C 870 280 870 392 805 425" fill="none" stroke="#c55245" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="875" y="340" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="18" font-weight="700" fill="#a33e35">FRICTION / OFFSET RESISTANCE</text>
  <line x1="150" y1="530" x2="780" y2="530" stroke="#24343b" stroke-width="2"/>
  <line x1="150" y1="520" x2="150" y2="540" stroke="#24343b" stroke-width="2"/>
  <line x1="780" y1="520" x2="780" y2="540" stroke="#24343b" stroke-width="2"/>
  <text x="265" y="568" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#24343b">Measure the effective distance from lock body to strike entry</text>
  <circle cx="895" cy="185" r="17" fill="#e08d32"/><text x="884" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" font-weight="700" fill="#fff">05</text><text x="925" y="191" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#24343b">SERVICE CLEARANCE</text><text x="925" y="218" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#60747a">Battery, tools and emergency power</text><text x="925" y="243" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#60747a">Leave room for wiring bend radius</text>
  <rect x="850" y="430" width="245" height=" ninety" rx="8" fill="#eef3f1" stroke="#3c716b" stroke-width="2"/>
  <text x="875" y="463" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" font-weight="700" fill="#3c716b">FIELD GATE</text><text x="875" y="490" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#24343b">No continuous push or pull when closed</text><text x="875" y="516" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="15" fill="#24343b">Latch enters and retracts in one cycle</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#e08d32"/></marker></defs>
</svg>
